name: CI

on:
  push:
    branches: [main, 'codex/workbench-ai-20261002-c258dd87']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify the public source export
        run: npm run release:source
      - uses: actions/upload-artifact@v4
        with:
          name: richangyu-source
          path: outputs/richangyu-life-workbench-v*-source.zip
          if-no-files-found: error
