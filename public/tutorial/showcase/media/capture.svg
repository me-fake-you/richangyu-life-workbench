<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title"><title id="title">日常屿AI预览与确认流程，虚构内容，非真实产品截图</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f5eb"/><stop offset="1" stop-color="#dfe8db"/></linearGradient></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213b34}.serif{font-family:"Noto Serif SC","Songti SC",Georgia,serif}.small{font-size:20px;fill:#6b776d}.tiny{font-size:16px;fill:#6b776d}</style><rect width="1500" height="900" fill="url(#bg)"/>
<text x="75" y="95" class="serif" font-size="43">预览，不等于保存。</text><text x="75" y="148" class="small">先理解，再核对，最后由你确认。</text><text x="75" y="190" class="tiny">流程示意 · 虚构内容 · 不是实时 AI 对话</text>
<rect x="70" y="275" width="410" height="420" rx="25" fill="#fffefa"/><text x="103" y="329" class="tiny">01 / 说一句话</text><text x="103" y="395" class="serif" font-size="28">明天下午</text><text x="103" y="440" class="serif" font-size="28">两点到四点做兼职</text><text x="103" y="575" class="small">先分清未来安排</text><text x="103" y="611" class="small">还是已经发生的记录</text>
<path d="M489 476H530l-10-10m10 10-10 10" stroke="#6b8b71" stroke-width="3" fill="none"/>
<rect x="545" y="275" width="410" height="420" rx="25" fill="#e4eee4"/><text x="578" y="329" class="tiny">02 / 核对预览</text><text x="578" y="395" class="serif" font-size="28">日期、时间、内容</text><text x="578" y="440" class="serif" font-size="28">还没有写入工作台</text><text x="578" y="575" class="small">可以确认，也可以取消</text><text x="578" y="611" class="small">涉及金额需单独同意</text>
<path d="M964 476H1005l-10-10m10 10-10 10" stroke="#6b8b71" stroke-width="3" fill="none"/>
<rect x="1020" y="275" width="410" height="420" rx="25" fill="#245b49"/><text x="1053" y="329" font-size="16" style="fill:#d2dfc9">03 / 主动确认</text><text x="1053" y="395" class="serif" font-size="28" style="fill:#fff">服务器校验成功</text><text x="1053" y="440" class="serif" font-size="28" style="fill:#fff">才显示已保存</text><text x="1053" y="575" font-size="20" style="fill:#d2dfc9">失败不能显示为成功</text><text x="1053" y="611" font-size="20" style="fill:#d2dfc9">AI 不能绕过你的确认</text>
<text x="75" y="792" class="serif" font-size="29">让 AI 帮忙整理，把决定权留给自己。</text><text x="75" y="848" class="tiny">功能仍在开发分支，完整检查尚未通过。图示不是功能验证证明。</text></svg>