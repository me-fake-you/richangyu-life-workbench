<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#6f4aa8" />
    <title>日常屿 · 暂时离线</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #fffaf4;
        color: #352e2b;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 34px;
        border: 1px solid rgba(111, 74, 168, 0.14);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(83, 62, 47, 0.1);
      }
      span {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 18px;
        background: #eee4fb;
        color: #6f4aa8;
        font-size: 24px;
      }
      h1 { margin: 24px 0 10px; font-size: 25px; }
      p { margin: 0; color: #7f746d; line-height: 1.75; }
      button {
        margin-top: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #6f4aa8;
        color: white;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <span>屿</span>
      <h1>暂时没有连接到网络</h1>
      <p>为了保护你的日记、照片、财务和私密记录，日常屿不会在离线页面缓存这些内容。网络恢复后即可继续同步编辑。</p>
      <button onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
